  <text x="64" y="92" font-family="JetBrainsMono Nerd Font Mono" font-weight="bold" font-size="104" fill="#1e1b22" text-anchor="middle">v</text>
  <rect x="22" y="104" width="84" height="8" rx="4" fill="#1e1b22"/>
</svg>
